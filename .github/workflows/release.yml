name: Build and Release Odyssey

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/app/Odyssey.Desktop/Odyssey.csproj

      - name: Set version from tag
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content src/app/Odyssey.Desktop/Odyssey.csproj) -replace '<Version>.*</Version>', "<Version>$version</Version>" `
            -replace '<AssemblyVersion>.*</AssemblyVersion>', "<AssemblyVersion>$version.0</AssemblyVersion>" `
            -replace '<FileVersion>.*</FileVersion>', "<FileVersion>$version.0</FileVersion>" `
            -replace '<InformationalVersion>.*</InformationalVersion>', "<InformationalVersion>$version</InformationalVersion>" |
            Set-Content src/app/Odyssey.Desktop/Odyssey.csproj

      - name: Build for .NET 10.0
        run: dotnet build src/app/Odyssey.Desktop/Odyssey.csproj --configuration Release

      - name: Publish for Windows installer
        run: dotnet publish src/app/Odyssey.Desktop/Odyssey.csproj --configuration Release --framework net10.0 --runtime win-x64 --self-contained true --output installer/publish/net10.0

      - name: Zip published files
        run: Compress-Archive -Path installer/publish/net10.0/* -DestinationPath Odyssey-net10.0-${{ github.ref_name }}.zip

      - name: Build MSI Installer
        run: dotnet build installer/OdysseySetup/OdysseySetup.wixproj --configuration Release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Odyssey-net10.0-${{ github.ref_name }}.zip
            installer/OdysseySetup/bin/Release/en-US/OdysseySetup.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}