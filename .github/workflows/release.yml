name: Build and Release Odyssey

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: odyssey-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version and create tag
        id: version
        shell: pwsh
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: ./scripts/Prepare-Release.ps1

      - name: Setup .NET
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet test src/Odyssey.slnx --configuration Release -p:OdysseyVersion=$env:RELEASE_VERSION

      - name: Build for .NET 10.0
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build src/app/Odyssey.Desktop/Odyssey.csproj --configuration Release -p:OdysseyVersion=$env:RELEASE_VERSION

      - name: Publish for Windows installer
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet publish src/app/Odyssey.Desktop/Odyssey.csproj --configuration Release --framework net10.0 --runtime win-x64 --self-contained true --output installer/publish/net10.0 -p:OdysseyVersion=$env:RELEASE_VERSION

      - name: Zip published files
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag_name }}
        run: Compress-Archive -Path installer/publish/net10.0/* -DestinationPath "Odyssey-net10.0-$env:RELEASE_TAG.zip"

      - name: Build MSI Installer
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build installer/OdysseySetup/OdysseySetup.wixproj --configuration Release -p:OdysseyVersion=$env:RELEASE_VERSION

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Odyssey ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          files: |
            Odyssey-net10.0-${{ steps.version.outputs.tag_name }}.zip
            installer/OdysseySetup/bin/Release/en-US/OdysseySetup.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
