name: Build and Release Odyssey

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: odyssey-release
  cancel-in-progress: false

env:
  VELOPACK_VERSION: 1.2.161

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and determine version
        id: version
        shell: pwsh
        run: ./scripts/Prepare-Release.ps1

      - name: Setup .NET
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Velopack CLI
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP\velopack-tools" vpk --version $env:VELOPACK_VERSION
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\velopack-tools"

      - name: Run tests
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet test src/Odyssey.slnx --configuration Release -p:OdysseyVersion=$env:RELEASE_VERSION

      - name: Build for .NET 10.0
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build src/app/Odyssey.Desktop/Odyssey.csproj --configuration Release -p:OdysseyVersion=$env:RELEASE_VERSION

      - name: Publish for Velopack installer
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet publish src/app/Odyssey.Desktop/Odyssey.csproj --configuration Release --framework net10.0 --runtime win-x64 --self-contained true --output artifacts/publish/win-x64 -p:OdysseyVersion=$env:RELEASE_VERSION

      - name: Download previous Velopack release for delta generation
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releases = @(gh release list --repo zendev1710/Odyssey --limit 1 --json tagName | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to list existing GitHub Releases.'
          }

          if ($releases.Count -gt 0) {
            $latestTag = $releases[0].tagName
            $assets = @(gh release view $latestTag --repo zendev1710/Odyssey --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to inspect release '$latestTag'."
            }

            if ($assets -contains 'releases.win.json') {
              vpk download github --repoUrl https://github.com/zendev1710/Odyssey --channel win --outputDir Releases
              if ($LASTEXITCODE -ne 0) {
                throw 'Unable to download the previous Velopack release.'
              }
            }
            else {
              Write-Host "Release '$latestTag' has no Velopack channel; creating the first full package."
            }
          }

      - name: Package Velopack release
        if: steps.version.outputs.should_release == 'true'
        run: vpk pack --packId zendev.Odyssey --packVersion "${{ steps.version.outputs.version }}" --packDir artifacts/publish/win-x64 --mainExe Odyssey.exe --packTitle Odyssey --runtime win-x64 --channel win --outputDir Releases --noPortable

      - name: Prepare Velopack release assets
        if: steps.version.outputs.should_release == 'true'
        id: assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets = @(
            'Releases/zendev.Odyssey-win-Setup.exe',
            "Releases/zendev.Odyssey-$env:RELEASE_VERSION-full.nupkg",
            'Releases/releases.win.json'
          )
          $deltaAsset = "Releases/zendev.Odyssey-$env:RELEASE_VERSION-delta.nupkg"
          if (Test-Path -LiteralPath $deltaAsset -PathType Leaf) {
            $assets += $deltaAsset
          }

          $missingAssets = @($assets | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missingAssets.Count -gt 0) {
            throw "Missing Velopack release assets: $($missingAssets -join ', ')"
          }

          $resolvedAssets = @($assets | ForEach-Object { (Resolve-Path -LiteralPath $_).Path })
          'files<<EOF' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $resolvedAssets | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          'EOF' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Odyssey ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          files: ${{ steps.assets.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
