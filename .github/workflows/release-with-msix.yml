name: Odyssey CI and Windows Installer

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: src/Odyssey.slnx                         # Odyssey solution path
      Installer_Project_Path: installer/OdysseySetup/OdysseySetup.wixproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Execute unit tests
      run: dotnet test ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }}

    - name: Publish the application for the installer
      if: matrix.configuration == 'Release'
      run: dotnet publish src/app/Odyssey.Desktop/Odyssey.csproj --configuration Release --framework net10.0 --runtime win-x64 --self-contained true --output installer/publish/net10.0

    - name: Build the WiX installer
      if: matrix.configuration == 'Release'
      run: dotnet build ${{ env.Installer_Project_Path }} --configuration Release

    - name: Upload MSI installer
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: Odyssey MSI installer
        path: installer/OdysseySetup/bin/Release/**/*.msi
        if-no-files-found: error
